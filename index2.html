<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYA DECO - Presupuestos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1b19;--mut:#6f6a60;--line:#e4ded3;--gold:#b08d4a;--dark:#1c1b19;--ok:#2f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1f1d1a;--ink:#f1ece2;--mut:#a39c8e;--line:#35312b;--gold:#d2ad6a;--dark:#0c0b0a;--ok:#6cc48f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--card:#1f1d1a;--ink:#f1ece2;--mut:#a39c8e;--line:#35312b;--gold:#d2ad6a;--dark:#0c0b0a;--ok:#6cc48f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
header{background:var(--dark);color:#f1ece2;text-align:center;padding:28px 16px}
header h1{margin:0;font:400 32px/1 Georgia,"Times New Roman",serif;letter-spacing:.35em;color:#d2ad6a;padding-left:.35em}
header p{margin:8px 0 0;font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.7}
main{max-width:980px;margin:0 auto;padding:20px 14px 40px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{margin:0 0 12px;font:600 12px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.line span:first-child{color:var(--mut)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:14px;border-radius:10px;background:var(--dark);color:#f1ece2}
.total b{font:400 26px Georgia,serif;color:#d2ad6a}
.ok{color:var(--ok)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{flex:1;min-width:150px;padding:12px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#1c1b19;font:600 14px inherit;cursor:pointer}
button.sec{background:transparent;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
#toast{margin-top:10px;font-size:13px;color:var(--mut);min-height:18px}
</style>
</head>
<body>
<header><h1>GYA DECO</h1><p>Calculador de presupuestos · Placas de PVC</p></header>
<main>
<section class="card">
  <h2>Datos</h2>
  <div class="row">
    <div><label>Cliente</label><input id="cli" placeholder="Nombre y apellido"></div>
    <div><label>Teléfono</label><input id="tel" placeholder="Opcional"></div>
    <div class="full"><label>Dirección de entrega</label><input id="dir" placeholder="Para el remito"></div>
  </div>
  <h2 style="margin-top:20px">Placa</h2>
  <div class="row">
    <div><label>Ancho (cm)</label><input id="w" type="number" value="50" min="1"></div>
    <div><label>Alto (cm)</label><input id="h" type="number" value="50" min="1"></div>
    <div><label>Costo por placa ($)</label><input id="cost" type="number" value="0" min="0"></div>
    <div><label>Aumento sobre costo (%)</label><input id="mk" type="number" value="50" min="0"></div>
  </div>
  <h2 style="margin-top:20px">Pedido</h2>
  <div class="row">
    <div><label>Metros cuadrados (m²)</label><input id="m2" type="number" value="10" min="0" step="0.01"></div>
    <div><label>Desperdicio / merma (%)</label><input id="mer" type="number" value="0" min="0"></div>
    <div><label>Descuento (%)</label><input id="dsc" type="number" value="0" min="0" max="100"></div>
    <div><label>Costo de envío si &le; 10 m² ($)</label><input id="ship" type="number" value="0" min="0"></div>
    <div class="full"><label>Validez del presupuesto (días)</label><input id="val" type="number" value="7" min="1"></div>
  </div>
</section>

<section class="card">
  <h2>Resumen</h2>
  <div id="sum"></div>
  <div class="total"><span>TOTAL</span><b id="tot">$0</b></div>
  <div class="btns">
    <button id="bp">Descargar presupuesto PDF</button>
    <button id="br" class="sec">Armar remito PDF</button>
  </div>
  <div id="toast"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const n=id=>Math.max(0,parseFloat($(id).value)||0);
const money=v=>"$ "+v.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>v.toLocaleString("es-AR",{maximumFractionDigits:2});

function calc(){
  const areaP=(n("w")*n("h"))/10000;
  const m2=n("m2"), mer=n("mer");
  const placas=areaP>0?Math.ceil((m2*(1+mer/100))/areaP-1e-9):0;
  const pvu=n("cost")*(1+n("mk")/100);
  const sub=placas*pvu;
  const d=Math.min(100,n("dsc"));
  const descM=sub*d/100;
  const gratis=m2>10;
  const envio=gratis?0:n("ship");
  const total=sub-descM+envio;
  return {areaP,m2,placas,pvu,sub,d,descM,gratis,envio,total,cubre:placas*areaP};
}
function render(){
  const c=calc();
  $("sum").innerHTML=[
    ["Superficie por placa",num(c.areaP)+" m²"],
    ["Placas necesarias","<b>"+c.placas+"</b> (cubren "+num(c.cubre)+" m²)"],
    ["Precio de venta por placa",money(c.pvu)],
    ["Subtotal",money(c.sub)],
    ["Descuento ("+num(c.d)+"%)","- "+money(c.descM)],
    ["Envío",c.gratis?'<span class="ok">GRATIS (más de 10 m²)</span>':money(c.envio)]
  ].map(r=>`<div class="line"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  $("tot").textContent=money(c.total);
  const ok=c.placas>0&&c.pvu>0;
  $("bp").disabled=!ok; $("br").disabled=c.placas<=0;
}
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",render));

const toast=t=>{$("toast").textContent=t};
const GOLD=[176,141,74], DARK=[28,27,25];
function head(doc,title,numero){
  doc.setFillColor(...DARK); doc.rect(0,0,210,38,"F");
  doc.setTextColor(210,173,106); doc.setFont("times","normal"); doc.setFontSize(28);
  doc.text("G Y A   D E C O",105,19,{align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(200,195,185);
  doc.text("PLACAS DE PVC",105,27,{align:"center"});
  doc.setFillColor(...GOLD); doc.rect(0,38,210,1.2,"F");
  doc.setTextColor(...DARK); doc.setFont("times","bold"); doc.setFontSize(18);
  doc.text(title,15,56);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110,105,96);
  const f=new Date().toLocaleDateString("es-AR");
  doc.text("N° "+numero,195,52,{align:"right"}); doc.text("Fecha: "+f,195,57,{align:"right"});
  doc.setTextColor(...DARK); doc.setFontSize(10);
  let y=70;
  doc.setFont("helvetica","bold"); doc.text("Cliente:",15,y); doc.setFont("helvetica","normal"); doc.text($("cli").value||"-",35,y);
  if($("tel").value){y+=6;doc.setFont("helvetica","bold");doc.text("Tel.:",15,y);doc.setFont("helvetica","normal");doc.text($("tel").value,35,y);}
  if($("dir").value){y+=6;doc.setFont("helvetica","bold");doc.text("Entrega:",15,y);doc.setFont("helvetica","normal");doc.text($("dir").value,35,y);}
  return y+10;
}
function th(doc,y,cols){
  doc.setFillColor(...DARK); doc.rect(15,y,180,8,"F");
  doc.setTextColor(210,173,106); doc.setFont("helvetica","bold"); doc.setFontSize(9);
  cols.forEach(c=>doc.text(c[0],c[1],y+5.4,{align:c[2]||"left"}));
  doc.setTextColor(...DARK); doc.setFont("helvetica","normal");
}
function foot(doc,t){
  doc.setDrawColor(...GOLD); doc.line(15,278,195,278);
  doc.setFontSize(8); doc.setTextColor(110,105,96);
  doc.text(t,105,284,{align:"center"});
}
function nro(p){const d=new Date();return p+"-"+d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")}
const desc=c=>`Placa de PVC ${num(n("w"))}x${num(n("h"))} cm`;

function save(doc,name){
  try{doc.save(name);toast("PDF descargado.");}
  catch(e){toast("No se pudo generar el PDF.");}
}
function pdfPresupuesto(){
  const c=calc(), doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  let y=head(doc,"PRESUPUESTO",nro("P"));
  th(doc,y,[["DESCRIPCIÓN",18],["CANT.",115,"right"],["P. UNIT.",155,"right"],["SUBTOTAL",192,"right"]]);
  y+=15; doc.setFontSize(10);
  doc.text(desc(),18,y); doc.text(String(c.placas),115,y,{align:"right"});
  doc.text(money(c.pvu),155,y,{align:"right"}); doc.text(money(c.sub),192,y,{align:"right"});
  y+=6; doc.setFontSize(8); doc.setTextColor(110,105,96);
  doc.text(`Superficie solicitada: ${num(c.m2)} m²  |  Superficie cubierta: ${num(c.cubre)} m²`,18,y);
  doc.setDrawColor(228,222,211); doc.line(15,y+4,195,y+4);
  y+=16; doc.setTextColor(...DARK); doc.setFontSize(10);
  const row=(l,v)=>{doc.text(l,135,y);doc.text(v,192,y,{align:"right"});y+=7;};
  row("Subtotal",money(c.sub));
  if(c.d>0) row(`Descuento (${num(c.d)}%)`,"- "+money(c.descM));
  row("Envío",c.gratis?"GRATIS":money(c.envio));
  y+=2; doc.setFillColor(...DARK); doc.rect(130,y-5,65,12,"F");
  doc.setTextColor(210,173,106); doc.setFont("times","bold"); doc.setFontSize(13);
  doc.text("TOTAL",135,y+3); doc.text(money(c.total),192,y+3,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setTextColor(110,105,96); doc.setFontSize(8);
  if(c.gratis) doc.text("Envío sin cargo por compras superiores a 10 m².",15,y+3);
  foot(doc,`Presupuesto válido por ${n("val")||7} días  |  GYA DECO`);
  save(doc,"Presupuesto-GYA-DECO-"+($("cli").value.trim().replace(/\s+/g,"-")||"cliente")+".pdf");
}
function pdfRemito(){
  const c=calc(), doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  let y=head(doc,"REMITO",nro("R"));
  th(doc,y,[["DESCRIPCIÓN",18],["CANTIDAD",192,"right"]]);
  y+=15; doc.setFontSize(10);
  doc.text(desc(),18,y); doc.text(c.placas+" unidades",192,y,{align:"right"});
  y+=6; doc.setFontSize(8); doc.setTextColor(110,105,96);
  doc.text(`Cubren ${num(c.cubre)} m²`,18,y);
  doc.setDrawColor(228,222,211); doc.line(15,y+4,195,y+4);
  doc.setTextColor(...DARK); doc.setFontSize(9);
  doc.text("Recibí conforme la mercadería detallada.",15,225);
  doc.setDrawColor(...DARK);
  doc.line(15,250,80,250); doc.text("Firma",15,255);
  doc.line(95,250,160,250); doc.text("Aclaración",95,255);
  foot(doc,"Documento no válido como factura  |  GYA DECO");
  save(doc,"Remito-GYA-DECO-"+($("cli").value.trim().replace(/\s+/g,"-")||"cliente")+".pdf");
}
$("bp").onclick=pdfPresupuesto; $("br").onclick=pdfRemito;
render();
</script>
</body>
</html>
